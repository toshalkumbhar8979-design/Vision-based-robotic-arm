<svg xmlns="http://www.w3.org/2000/svg" width="4cm" height="4cm" viewBox="0 0 300 300">
  <!-- Background / White Margin -->
  <rect width="300" height="300" fill="white" />
  <!-- Outer Black Border -->
  <rect x="0" y="0" width="300" height="300" fill="black" />
  <!-- White Inner Padding Box -->
  <rect x="50" y="50" width="200" height="200" fill="white" />
  <rect x="100" y="50" width="50" height="50" fill="black" />
  <rect x="50" y="100" width="50" height="50" fill="black" />
  <rect x="150" y="100" width="50" height="50" fill="black" />
  <rect x="50" y="150" width="50" height="50" fill="black" />
  <rect x="100" y="150" width="50" height="50" fill="black" />
  <rect x="50" y="200" width="50" height="50" fill="black" />
  <rect x="100" y="200" width="50" height="50" fill="black" />
  <rect x="200" y="200" width="50" height="50" fill="black" />
</svg>